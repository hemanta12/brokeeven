[build]
builder = "NIXPACKS"
buildCommand = "npm run generate && npm run build --workspace @brokeeven/api"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
startCommand = "npm run db:migrate --workspace @brokeeven/api && npm run start --workspace @brokeeven/api"
